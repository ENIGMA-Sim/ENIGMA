name: Docker image

# Publishes edelpozop/enigma to Docker Hub when a version tag is pushed:
#   git tag v1.3 && git push origin v1.3   ->  edelpozop/enigma:1.3 + :latest
# It can also be launched by hand from the "Actions" tab (workflow_dispatch).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   Docker Hub user
#   DOCKERHUB_TOKEN      Docker Hub access token (Read & Write)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: edelpozop/enigma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.3 -> tags "1.3" and "latest"; manual runs -> "latest" only
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=v(.*),group=1
          flavor: |
            latest=true

      # Build once and load it locally so it can be tested before publishing.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: enigma:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (use case 1 + Python bindings)
        run: |
          docker run --rm enigma:ci python3 -c "import simgrid"
          docker run --rm enigma:ci ./use_cases/01_edge_computing/run.sh 2>&1 | tee uc1.log
          grep -q "Total energy consumed" uc1.log

      # Reuses the cached layers from the Build step, so this is quick.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
